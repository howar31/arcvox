name: Bug report / 問題回報
description: Something does not work as expected. / 功能未如預期運作。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Opened from Settings > About > Report an issue, the first four fields are filled in; the steps and results below are yours to write.
        感謝回報。從「設定 > 關於 > 回報問題」開啟時，前四欄會自動填入；請填寫下方的重現步驟與結果。
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Filled in when the form is opened from Settings > About > Report an issue. / 從「設定 > 關於 > 回報問題」開啟本表單時會自動填入。
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System / 系統
      description: Filled in when the form is opened from the app. / 從 app 開啟時會自動填入。
      placeholder: macOS 26.0 (25A354), aarch64
    validations:
      required: true
  - type: input
    id: engines
    attributes:
      label: Engines in use / 使用中的引擎
      description: Filled in when the form is opened from the app; change it if the problem happened with another profile. / 從 app 開啟時會填入預設情境的引擎；問題發生在其他情境時請修改。
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / 診斷資訊
      description: |
        Filled in when the form is opened from the app; or press "Copy diagnostics" on that page and paste it here.
        從 app 開啟時會自動帶入；或在該頁按「複製診斷資訊」後貼到這裡。
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / 預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual / 實際結果
      description: Attach a screenshot or recording if it helps. / 有截圖或錄影請一併附上。
    validations:
      required: true
