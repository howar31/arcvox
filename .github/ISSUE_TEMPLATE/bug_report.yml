name: Bug report / 問題回報
description: Something does not work as expected. / 功能未如預期運作。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Fill in what you can; the version and the steps help us reproduce the problem.
        感謝回報。請盡量填寫，版本與重現步驟能幫助我們重現問題。
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Settings > About shows it, and so does the first line of the menu-bar menu. / 設定 > 關於，或選單列選單的第一行。
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System version / 系統版本
      placeholder: macOS 26.0
    validations:
      required: true
  - type: textarea
    id: engines
    attributes:
      label: Engines in use / 使用中的引擎
      description: The speech recognition and text engines of the profile, with the model when local. / 情境所用的語音辨識與文字引擎，本機引擎請附模型名稱。
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / 預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual / 實際結果
      description: Attach a screenshot or recording if it helps. / 有截圖或錄影請一併附上。
    validations:
      required: true
