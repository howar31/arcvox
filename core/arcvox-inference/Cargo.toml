[package]
name = "arcvox-inference"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Arcvox in-process speech and language model providers"

[features]
default = []
metal = ["whisper-rs/metal", "llama-cpp-2/metal"]
vulkan = ["whisper-rs/vulkan", "llama-cpp-2/vulkan"]
cuda = ["whisper-rs/cuda", "llama-cpp-2/cuda"]
# The quality measurement command (`arcvox-eval`).
cli = ["reqwest", "serde_json"]

[dependencies]
arcvox-core = { path = "../arcvox-core" }
whisper-rs = { version = "=0.16.0", features = ["tracing_backend"] }
llama-cpp-2 = { version = "=0.1.157", features = ["mtmd"] }
encoding_rs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde_json = { version = "1", optional = true }

[[bin]]
name = "arcvox-eval"
path = "src/bin/arcvox_eval.rs"
required-features = ["cli"]

[dev-dependencies]
arcvox-core = { path = "../arcvox-core", features = ["test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hound = "3"
tempfile = "3"
