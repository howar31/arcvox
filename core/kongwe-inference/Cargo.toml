[package]
name = "kongwe-inference"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kongwe in-process speech and language model providers"

[features]
default = []
metal = ["whisper-rs/metal", "llama-cpp-2/metal"]
vulkan = ["whisper-rs/vulkan", "llama-cpp-2/vulkan"]
cuda = ["whisper-rs/cuda", "llama-cpp-2/cuda"]

[dependencies]
kongwe-core = { path = "../kongwe-core" }
whisper-rs = { version = "=0.16.0", features = ["tracing_backend"] }
llama-cpp-2 = "=0.1.157"
encoding_rs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hound = "3"
tempfile = "3"
