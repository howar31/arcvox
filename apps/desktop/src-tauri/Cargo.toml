[package]
name = "arcvox-desktop"
version = "0.1.0"
description = "Arcvox dictation client for macOS"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "arcvox_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arcvox-core = { path = "../../../core/arcvox-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
cpal = "0.18"
rubato = "0.16"
earshot = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
arcvox-inference = { path = "../../../core/arcvox-inference", features = ["metal"] }
tauri-nspanel = "2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSValue", "NSData", "NSLocale", "NSObject", "NSEnumerator", "NSFileManager", "NSURL", "NSGeometry", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "NSUserDefaults", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSGraphics", "NSResponder", "NSWindow", "NSApplication", "NSImage", "libc", "block2"] }
block2 = "0.6"
core-graphics = "0.25"
core-foundation = "0.10"
accessibility-sys = "0.2"
security-framework = "3"
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
arcvox-inference = { path = "../../../core/arcvox-inference" }

[dev-dependencies]
arcvox-core = { path = "../../../core/arcvox-core", features = ["test-util"] }
wiremock = "0.6"
sha2 = "0.10"
tempfile = "3"
hound = "3"
