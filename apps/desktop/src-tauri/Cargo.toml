[package]
name = "kongwe-desktop"
version = "0.1.0"
description = "Kongwe dictation client for macOS"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "kongwe_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kongwe-core = { path = "../../../core/kongwe-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
cpal = "0.18"
rubato = "0.16"
earshot = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSLocale", "NSObject", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSResponder", "NSWindow", "libc", "block2"] }
block2 = "0.6"
core-graphics = "0.25"
core-foundation = "0.10"
accessibility-sys = "0.2"
security-framework = "3"
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
